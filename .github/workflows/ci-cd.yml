name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-validation:
    name: Backend Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci

      - name: Check syntax
        working-directory: ./backend
        run: node --check index.js

      - name: Unit tests (session, CSRF, sockets)
        working-directory: ./backend
        run: npm test

  backend-integration:
    name: Backend Integration Tests (real PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dateza_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'
      - working-directory: ./backend
        run: npm ci
      - name: Integration tests
        working-directory: ./backend
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dateza_test
        run: npm run test:integration

  mobile-validation:
    name: Mobile Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'mobile/package-lock.json'

      - name: Install dependencies
        working-directory: ./mobile
        run: npm ci

      - name: Verify TypeScript types
        working-directory: ./mobile
        run: npx tsc --noEmit

      - name: Run linter
        working-directory: ./mobile
        run: npm run lint
