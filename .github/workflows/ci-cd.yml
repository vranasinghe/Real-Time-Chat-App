name: CI/CD Pipeline

# Node version comes from .nvmrc (22), the same major version Render uses (see render.yaml).
# `npm run test:all` runs the same checks locally.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-validation:
    name: Backend Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci

      - name: Check syntax
        working-directory: ./backend
        run: node --check index.js

      - name: Unit tests (sessions, CSRF, sockets, validation, migration safety, showcase fixtures)
        working-directory: ./backend
        run: npm test

  backend-integration:
    name: Backend Integration Tests (real PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dateza_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'
      - working-directory: ./backend
        run: npm ci
      - name: Integration tests
        working-directory: ./backend
        env:
          # A throwaway service container. The test file refuses any non-local database.
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dateza_test
        run: npm run test:integration

  mobile-validation:
    name: Mobile Validation (types, lint, web export)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'mobile/package-lock.json'

      - name: Install dependencies
        working-directory: ./mobile
        run: npm ci

      - name: Verify TypeScript types
        working-directory: ./mobile
        run: npm run typecheck

      - name: Run linter (no warnings allowed)
        working-directory: ./mobile
        run: npm run lint -- --max-warnings 0

      - name: Web export build
        working-directory: ./mobile
        env:
          # Placeholder HTTPS origin: the build only inlines it. No request is made to it.
          EXPO_PUBLIC_BACKEND_URL: https://api.example.com
        run: npm run export:web

  dependency-audit:
    name: Dependency Vulnerability Report (informational)
    runs-on: ubuntu-latest
    # Reports only. Many advisories need breaking upgrades (Expo SDK, React Native tooling) that
    # are planned separately, so this job never fails the pipeline.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Report vulnerabilities (backend and mobile, all and production-only)
        run: |
          {
            echo '### npm audit (report only)'
            echo '```'
            npm run --silent audit:report
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
