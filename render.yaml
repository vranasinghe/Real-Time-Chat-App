# Render Blueprint for Dateza
#
# Creates two services:
#   dateza-api  Express + Socket.io backend (free web service)
#   dateza-web  Expo web build, served as a static site
#
# The database is an external Neon Postgres. When you create this Blueprint in the
# Render Dashboard you'll be prompted for the values marked `sync: false`:
#   DATABASE_URL             Neon connection string (keep it secret)
#   CORS_ORIGIN              Web app URL, e.g. https://dateza-web.onrender.com
#                            (can be left empty at first, which allows any origin)
#   EXPO_PUBLIC_BACKEND_URL  Backend URL, e.g. https://dateza-api.onrender.com
#                            (baked into the web build, so redeploy the site if it changes)
#
# Tables, sample profiles and the Live Demo accounts are created automatically on first start.

projects:
  - name: dateza
    environments:
      - name: production
        services:
          - type: web
            name: dateza-api
            runtime: node
            plan: free
            rootDir: backend
            buildCommand: npm ci
            startCommand: node index.js
            healthCheckPath: /
            envVars:
              - key: NODE_VERSION
                value: "22"
              - key: DATABASE_URL
                sync: false
              - key: JWT_SECRET
                generateValue: true
              - key: CORS_ORIGIN
                sync: false
              - key: DEMO_LOGIN_ENABLED
                value: "true"

          - type: web
            name: dateza-web
            runtime: static
            # staticPublishPath is relative to the repo root, so build from mobile/
            buildCommand: cd mobile && npm ci && npx expo export --platform web
            staticPublishPath: ./mobile/dist
            routes:
              # Pages that don't exist as files (deep links) load the app shell
              - type: rewrite
                source: /*
                destination: /index.html
            envVars:
              - key: NODE_VERSION
                value: "22"
              - key: EXPO_PUBLIC_BACKEND_URL
                sync: false
