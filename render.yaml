# Render Blueprint for Dateza
#
# Creates the backend service:
#   dateza-api  Express + Socket.io backend
# The web app is deployed separately on Vercel (see mobile/vercel.json), which also
# proxies /api/* to this service so the session cookie is first-party.
#
# The database is an external Neon Postgres. When you create this Blueprint in the
# Render Dashboard you'll be prompted for the values marked `sync: false`:
#   DATABASE_URL             Neon connection string (keep it secret)
#
# Tables, sample profiles and the Live Demo accounts are created automatically on first start.

projects:
  - name: dateza
    environments:
      - name: production
        services:
          - type: web
            name: dateza-api
            runtime: node
            plan: free
            rootDir: backend
            buildCommand: npm ci
            startCommand: node index.js
            healthCheckPath: /readyz
            envVars:
              - key: NODE_VERSION
                value: "22"
              - key: DATABASE_URL
                sync: false
              - key: JWT_SECRET
                generateValue: true
              - key: NODE_ENV
                value: production
              - key: CORS_ORIGIN
                # Web app origin(s), comma separated. Not a secret.
                value: https://real-time-chat-app-tau-six.vercel.app
              # The shared one-tap demo login must NOT run on the consumer production service. It is
              # off by default and the backend ignores DEMO_LOGIN_ENABLED=true in production unless
              # DEMO_ENVIRONMENT=isolated is also set (see backend/config.js). If a public demo is wanted,
              # create a SEPARATE service with its OWN database and set both variables there.
              - key: DEMO_LOGIN_ENABLED
                value: "false"
              # Optional: add RESEND_API_KEY and MAIL_FROM in the dashboard to enable email.
              # Without a provider, verification is optional and password reset is unavailable.
